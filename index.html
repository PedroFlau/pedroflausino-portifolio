<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfólio de Pedro Flausino Mendonça — estudante de Ciência da Computação."
    />
    <title>Pedro Flausino Mendonça · Portfólio</title>
    <script>
      // Aplica o tema salvo antes da página renderizar (evita "piscada")
      (function () {
        try {
          var tema = localStorage.getItem('tema');
          document.documentElement.dataset.theme =
            tema === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
